name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies (no models, no GPU)
        run: python -m pip install -r requirements-test.txt
      # No PYTHONUTF8 here on purpose: Windows' default cp1252 catches encoding bugs.
      - name: Run tests (test_memory.py downloads an embedding model, so it is skipped)
        run: python -m pytest -q --ignore=tests/test_memory.py
